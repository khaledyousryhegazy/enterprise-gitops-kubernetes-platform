apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-platform-deployment-backend
  namespace: app
  labels:
    app.kubernetes.io/name: gitops-platform-backend
    app.kubernetes.io/instance: gitops-platform-backend-production
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    team: a-team
    env: production
spec:
  replicas: {{ .Values.replicaCountBackend }}
  minReadySeconds: 30
  revisionHistoryLimit: 10
  strategy:
    rollingUpdate:
      maxUnavailable: 20%
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitops-platform-backend
      app.kubernetes.io/instance: gitops-platform-backend-production
      app.kubernetes.io/managed-by: {{ .Release.Service }}
      team: a-team
      env: production
  template:
    metadata:
      annotations:
        # Force deployment replicas rollout on each change.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/external-secret: {{ include (print $.Template.BasePath "/external-secret.yaml") . | sha256sum }}
        checksum/rds-ca: {{ include (print $.Template.BasePath "/rds-ca-configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: gitops-platform-backend
        app.kubernetes.io/instance: gitops-platform-backend-production
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        team: a-team
        env: production
    spec:
      containers:
        - name: app-backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: /app/certs/rds-ca-bundle.pem
          envFrom:
            - configMapRef:
                name: gitops-platform-config
            - secretRef:
                name: gitops-platform-secrets
          ports:
            - containerPort: 4000
              name: http
              protocol: TCP
          imagePullPolicy: Always
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: rds-ca-bundle
              mountPath: /app/certs/rds-ca-bundle.pem
              subPath: rds-ca-bundle.pem
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4000
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: rds-ca-bundle
          configMap:
            name: gitops-platform-rds-ca
