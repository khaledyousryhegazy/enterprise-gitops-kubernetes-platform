apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitops-platform-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: gitops-platform-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        DATABASE_URL: >-
          {{ `postgres://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}?sslmode=require` }}
        JWT_SECRET: "{{ `{{ .jwtSecret }}` }}"
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.aws.appDatabaseSecretName | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.aws.appDatabaseSecretName | quote }}
        property: password
    - secretKey: host
      remoteRef:
        key: {{ .Values.aws.appDatabaseSecretName | quote }}
        property: host
    - secretKey: port
      remoteRef:
        key: {{ .Values.aws.appDatabaseSecretName | quote }}
        property: port
    - secretKey: dbname
      remoteRef:
        key: {{ .Values.aws.appDatabaseSecretName | quote }}
        property: dbname
    - secretKey: jwtSecret
      remoteRef:
        key: {{ .Values.aws.appDatabaseSecretName | quote }}
        property: jwtSecret
