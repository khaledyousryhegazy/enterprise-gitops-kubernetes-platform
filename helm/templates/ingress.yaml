{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitops-platform-ingress
  namespace: app
  labels:
    app.kubernetes.io/name: gitops-platform-ingress
    app.kubernetes.io/instance: gitops-platform-ingress
  annotations:
    # create alb before facing the internet
    alb.ingress.kubernetes.io/scheme: internet-facing
    # redirect the traffic directly to pod's IP not to the node
    alb.ingress.kubernetes.io/target-type: ip
spec:
  # the default that will deal with ingress is alb
  ingressClassName: {{ .Values.ingress.className | default "alb" | quote }}
  rules:
    {{- range .Values.ingress.hosts }}
    - {{- if .host }}
      host: {{ .host | quote }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
    {{- end }}
{{- end }}
