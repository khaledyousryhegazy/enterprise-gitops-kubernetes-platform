replicaCountFrontend: 2
replicaCountBackend: 2

ingress:
  enabled: true
  className: alb
  hosts:
    - host: ""

frontend:
  image:
    repository: "604275788373.dkr.ecr.us-east-1.amazonaws.com/gitops-k8s-ecr-frontend"
    tag: "dev"
  resources:
    requests:
      memory: 128Mi
      cpu: 64m
    limits:
      memory: 256Mi
      cpu: 128m

backend:
  image:
    repository: "604275788373.dkr.ecr.us-east-1.amazonaws.com/gitops-k8s-ecr-backend"
    tag: "dev"
  resources:
    requests:
      memory: 128Mi
      cpu: 64m
    limits:
      memory: 256Mi
      cpu: 128m
